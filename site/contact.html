<!DOCTYPE html>
<html lang="ja">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8157072601453336"
     crossorigin="anonymous"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261010">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<meta name="description" content="いのころもち.comへのお問い合わせはこちらから。ご質問・ご感想・お仕事のご依頼など、お気軽にご連絡ください。">
<meta property="og:site_name" content="いのころもち.com">
<meta property="og:title" content="お問い合わせ — いのころもち.com">
<meta property="og:description" content="いのころもち.comへのお問い合わせはこちらから。ご質問・ご感想・お仕事のご依頼など、お気軽にご連絡ください。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://inocoromochi.com/contact.html">
<meta property="og:image" content="https://inocoromochi.com/assets/images/ogp-brand.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://inocoromochi.com/contact.html">
<title>お問い合わせ — いのころもち.com</title>
</head>
<body data-base="" data-page="">
<div class="site-container">
  <nav class="nav"></nav>
  <main class="main">
    <section class="page-header">
      <h1>お問い合わせ</h1>
      <p>ご質問・ご感想・お仕事のご依頼など、お気軽にご連絡ください。</p>
    </section>

    <section class="contact-section">
      <form id="contact-form" class="content-card-lg contact-form">
        <div class="form-group">
          <label class="form-label" for="contact-name">お名前</label>
          <input class="form-input" type="text" id="contact-name" name="name" required autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label" for="contact-email">メールアドレス</label>
          <input class="form-input" type="email" id="contact-email" name="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="contact-subject">件名</label>
          <input class="form-input" type="text" id="contact-subject" name="subject" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="contact-message">お問い合わせ内容</label>
          <textarea class="form-textarea" id="contact-message" name="message" rows="8" required></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary contact-submit">送信する</button>
          <p id="form-result" class="form-result"></p>
        </div>
      </form>

      <div class="contact-direct">
        <p class="klee">メールでも直接お問い合わせいただけます。</p>
        <a href="mailto:info@inocoromochi.com" class="contact-email-link">info@inocoromochi.com</a>
      </div>
    </section>
  </main>
  <footer class="footer"></footer>
</div>
<script src="js/main.js?v=20261010"></script>
<script>
document.getElementById('contact-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var btn = document.querySelector('.contact-submit');
  var result = document.getElementById('form-result');
  btn.disabled = true;
  btn.textContent = '送信中…';
  result.textContent = '';
  result.className = 'form-result';

  fetch('https://mail.inocoromochi.com/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: document.getElementById('contact-name').value,
      email: document.getElementById('contact-email').value,
      subject: document.getElementById('contact-subject').value,
      message: document.getElementById('contact-message').value
    })
  })
  .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
  .then(function(r) {
    if (r.ok) {
      result.textContent = 'お問い合わせを送信しました。ありがとうございます。';
      result.className = 'form-result form-result-ok';
      document.getElementById('contact-form').reset();
    } else {
      result.textContent = r.data.error || '送信に失敗しました。';
      result.className = 'form-result form-result-err';
    }
  })
  .catch(function() {
    result.textContent = '送信に失敗しました。時間をおいて再度お試しください。';
    result.className = 'form-result form-result-err';
  })
  .finally(function() {
    btn.disabled = false;
    btn.textContent = '送信する';
  });
});
</script>
</body>
</html>
